<html lang="en">

<meta name="apple-mobile-web-app-title" content="Flashcards">
<title>English Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:#f7f4ef;color:#1a1a2e;min-height:100vh}
button,input{font-family:Georgia,serif}
::-webkit-scrollbar{display:none}
.page{max-width:500px;margin:0 auto;padding:1.5rem 1rem 3rem}
.page-center{max-width:500px;margin:0 auto;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
h1{font-size:22px;font-weight:600;color:#1a1a2e}
h2{font-size:18px;font-weight:600;color:#1a1a2e}
.label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7a7060}
.muted{color:#7a7060}
.card{background:#fff;border:1px solid #ddd8d0;border-radius:8px;padding:1.1rem 1.2rem}
.card-study{background:#fff;border:1px solid #ddd8d0;border-radius:12px;padding:1.8rem 1.4rem;text-align:center;margin-bottom:1rem}
.btn{border:none;border-radius:6px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:Georgia,serif;color:#fff}
.btn-dark{background:#1a1a2e}
.btn-green{background:#2a6e5a}
.btn-blue{background:#1a6a8a}
.btn-red{background:#c0392b}
.btn-outline{background:transparent;color:#7a7060;border:1px solid #ddd8d0}
.btn-full{width:100%;padding:13px;font-size:15px}
.btn-small{font-size:12px;padding:6px 12px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.2rem}
.stat-box{background:#fff;border:1px solid #ddd8d0;border-radius:8px;padding:10px 6px;text-align:center}
.stat-num{font-size:22px;font-weight:600}
.stat-lbl{font-size:10px;color:#7a7060;letter-spacing:.07em;text-transform:uppercase}
.topic-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:1.2rem}
.topic-pill{flex-shrink:0;padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:Georgia,serif;border:1.5px solid #ddd8d0;background:#fff;color:#1a1a2e}
.topic-pill.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.progress-bar{background:#ddd8d0;border-radius:3px;height:4px;margin-bottom:1.5rem}
.progress-fill{background:#1a1a2e;height:100%;border-radius:3px;transition:width .3s}
.result-ok{background:#e8f5f0;border:1.5px solid #a8d8c8;border-radius:8px;padding:10px;margin-bottom:1rem}
.result-fail{background:#fdf0ee;border:1.5px solid #f0c4be;border-radius:8px;padding:10px;margin-bottom:1rem}
.rate-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.rate-btn{border:none;border-radius:6px;font-size:13px;padding:9px 4px;cursor:pointer;color:#fff;font-family:Georgia,serif;font-weight:600;line-height:1.4}
.session-header{display:flex;justify-content:space-between;font-size:12px;color:#7a7060;margin-bottom:5px}
input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:2px solid #ddd8d0;border-radius:6px;outline:none;background:#fafaf8;font-family:Georgia,serif}
input[type=text]:focus{border-color:#1a1a2e}
input[type=range]{width:100%;accent-color:#2a6e5a}
.field-label{font-size:11px;color:#7a7060;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.word-list-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd8d0;font-size:13px}
.divider{border-bottom:2px solid #1a1a2e;padding-bottom:1rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:flex-end}
.new-badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:#e8e4dc;color:#7a7060;margin-bottom:10px}
.info-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.info-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.info-box{background:#e8f5f0;border:1.5px solid #a8d8c8;border-radius:8px;padding:10px 14px;margin-top:.5rem;font-size:12px;color:#2a6e5a;line-height:1.6}
</style>
</head>

const KS="fc_srs_v1", KM="fc_meta_v1", KC="fc_custom_v1";
function sg(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}}

// ── SRS ───────────────────────────────────────────────────────────────────────
function todayStr(){return new Date().toISOString().split("T")[0]}
function addDays(base,n){const d=new Date(base+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().split("T")[0]}
function sm2(card,q){
  let{interval:iv=0,ease:ez=2.5,reps=0,lapses=0}=card||{};
  const t=todayStr();
  if(q<3)return{interval:1,ease:Math.max(1.3,ez-.2),reps:0,lapses:lapses+1,due:addDays(t,1)};
  let ni=reps===0?1:reps===1?4:Math.round(iv*ez);
  let ne=Math.max(1.3,ez+.1-(5-q)*(.08+(5-q)*.02));
  return{interval:ni,ease:ne,reps:reps+1,lapses,due:addDays(t,ni)};
}
function nextInterval(card,q){return sm2(card,q).interval}

// ── ANSWER CHECK ──────────────────────────────────────────────────────────────
function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.,!?]/g,"")}
function checkAnswer(input,correct){
  const inp=norm(input);
  return correct.split(" / ").map(a=>norm(a.trim())).some(a=>a===inp);
}

  screen:"home",
  srs:sg(KS)||{},
  meta:sg(KM)||{newPerDay:20,topic:0},
  custom:sg(KC)||[],
  queue:[],qi:0,
  typed:"",submitted:false,isOk:false,
  sok:0,sfail:0,
  addE:"",addR:"",addMsg:""
};

function allWords(){
  const base=W.map(([e,r,t],i)=>({id:i,e,r,t}));
  const cust=state.custom.map((w,i)=>({id:10000+i,e:w.e,r:w.r,t:0}));
  return [...base,...cust];
}

function buildQ(){
  const words=allWords(), today=todayStr(), tf=state.meta.topic;
  const inT=w=>tf===0||w.t===tf;
  const due=words.filter(w=>inT(w)&&state.srs[w.id]?.due&&state.srs[w.id].due<=today);
  const newW=words.filter(w=>inT(w)&&!state.srs[w.id]).slice(0,state.meta.newPerDay);
  return [...due.sort(()=>Math.random()-.5),...newW];
}

}

  return `<${tag} class="${cls}" ${extra}>${inner}</${tag}>`;
}

// ── HOME SCREEN ───────────────────────────────────────────────────────────────
screens={};
screens.home=function(){
  const words=allWords(), tf=state.meta.topic;
  const inT=w=>tf===0||w.t===tf;
  const tw=words.filter(inT);
  const learned=tw.filter(w=>(state.srs[w.id]?.reps||0)>=2).length;
  const dueQ=buildQ();
  const due=dueQ.length;

  const pills=TOPICS.map((t,i)=>{
    const cnt=i===0?words.length:words.filter(w=>w.t===i).length;
    const active=state.meta.topic===i?"active":"";
    return `<button class="topic-pill ${active}" data-topic="${i}">${EMOJI[i]} ${t} <span style="opacity:.55;font-size:11px">(${cnt})</span></button>`;
  }).join("");

  return `<div class="page">
  <div class="divider">
    <div>
      <div class="label" style="margin-bottom:3px">Spaced repetition · typing</div>
      <h1>Flashcard Trainer</h1>
    </div>
    <button class="btn btn-outline btn-small" data-action="showInfo">📱 iPhone</button>
  </div>

  <div class="label" style="margin-bottom:7px">Topic</div>
  <div class="topic-scroll">${pills}</div>

  <div class="stats">
    <div class="stat-box"><div class="stat-num" style="color:#1a1a2e">${tw.length}</div><div class="stat-lbl">Words</div></div>
    <div class="stat-box"><div class="stat-num" style="color:#2a6e5a">${learned}</div><div class="stat-lbl">Learned</div></div>
    <div class="stat-box"><div class="stat-num" style="color:${due>0?"#c0392b":"#7a7060"}">${due}</div><div class="stat-lbl">Due now</div></div>
  </div>

  <button class="btn btn-full ${due>0?"btn-dark":"btn-outline"}" style="margin-bottom:10px;${due===0?"opacity:.5":""}" data-action="start">
    ${due>0?`▶  Start session (${due} cards)`:"✓  Nothing due today"}
  </button>
  <button class="btn btn-full btn-outline" style="margin-bottom:1.5rem" data-action="goAdd">+ Add word / phrase</button>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
      <span style="font-size:13px;font-weight:600">New cards per day</span>
      <span style="font-size:17px;font-weight:600;color:#2a6e5a" id="npdLabel">${state.meta.newPerDay}</span>
    </div>
    <input type="range" min="5" max="50" step="5" value="${state.meta.newPerDay}" id="npdRange">
    <p style="font-size:11px;color:#7a7060;margin-top:5px">These are review words — you've seen them all in lessons.</p>
  </div>
</div>`;
};

// ── STUDY SCREEN ──────────────────────────────────────────────────────────────
screens.study=function(){
  const w=state.queue[state.qi];
  if(!w) return screens.done();
  const pct=Math.round(state.qi/state.queue.length*100);
  const isNew=!state.srs[w.id];

  let inputArea;
  if(!state.submitted){
    inputArea=`
    <input type="text" id="answerInput" value="${state.typed.replace(/"/g,'&quot;')}" placeholder="type here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="btn btn-dark btn-full" style="margin-top:10px" data-action="submit">Check ↵</button>`;
  } else {
    const resClass=state.isOk?"result-ok":"result-fail";
    const resColor=state.isOk?"#2a6e5a":"#c0392b";
    const resText=state.isOk?"✓ Correct!":"✗ Not quite";
    const wrongLine=!state.isOk?`<p style="margin:3px 0 0;font-size:14px;color:#1a1a2e">Answer: <strong>${esc(w.e)}</strong></p>`:"";
    const c=state.srs[w.id];
    inputArea=`
    <div class="${resClass}">
      <p style="margin:0;font-size:14px;font-weight:600;color:${resColor}">${resText}</p>
      ${wrongLine}
    </div>
    <p class="label" style="margin-bottom:7px">How well did you know it?</p>
    <div class="rate-grid">
      <button class="rate-btn" style="background:#c0392b" data-rate="1">Again<br><span style="font-size:10px;font-weight:400">1d</span></button>
      <button class="rate-btn" style="background:#2a6e5a" data-rate="4">Good<br><span style="font-size:10px;font-weight:400">${nextInterval(c,4)}d</span></button>
      <button class="rate-btn" style="background:#1a6a8a" data-rate="5">Easy<br><span style="font-size:10px;font-weight:400">${nextInterval(c,5)}d</span></button>
    </div>`;
  }

  return `<div class="page">
  <div class="session-header">
    <span>${state.qi}/${state.queue.length}</span>
    <span><span style="color:#2a6e5a">✓ ${state.sok}</span>  <span style="color:#c0392b">✗ ${state.sfail}</span></span>
  </div>
  <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>

  <div class="card-study">
    ${isNew?'<div class="new-badge">new word</div>':''}
    <p class="label" style="margin-bottom:8px">Type the English:</p>
    <p style="font-size:21px;font-weight:600;color:#1a1a2e;margin-bottom:1.5rem;line-height:1.3">${esc(w.r)}</p>
    ${inputArea}
  </div>
  <button class="btn btn-outline btn-small" data-action="goHome">← Home</button>
</div>`;
};

// ── DONE SCREEN ───────────────────────────────────────────────────────────────
screens.done=function(){
  const total=state.sok+state.sfail;
  return `<div class="page-center">
  <p style="font-size:44px;margin-bottom:8px">🎉</p>
  <h2 style="margin-bottom:8px">Session complete!</h2>
  ${total>0?`<p class="muted" style="font-size:14px;margin-bottom:1.5rem"><span style="color:#2a6e5a">✓ ${state.sok}</span> correct · <span style="color:#c0392b">✗ ${state.sfail}</span> incorrect</p>`
           :`<p class="muted" style="font-size:14px;margin-bottom:1.5rem">Nothing due — come back tomorrow!</p>`}
  <button class="btn btn-dark" style="padding:11px 32px" data-action="goHome">Back to home</button>
</div>`;
};

// ── ADD SCREEN ────────────────────────────────────────────────────────────────
screens.add=function(){
  const recent=[...state.custom].reverse().slice(0,10);
  const list=recent.length?`<div style="margin-top:1.2rem">
    <p class="label" style="margin-bottom:6px">Your added words (${state.custom.length})</p>
    ${recent.map(w=>`<div class="word-list-item"><span style="font-weight:600">${esc(w.e)}</span><span class="muted">${esc(w.r)}</span></div>`).join("")}
  </div>`:"";

  return `<div class="page">
  <button class="btn btn-outline btn-small" style="margin-bottom:1.5rem" data-action="goHome">← Back</button>
  <h2 style="margin-bottom:1.2rem">Add a word or phrase</h2>
  <div class="card">
    <label class="field-label">English word / phrase</label>
    <input type="text" id="addE" value="${esc(state.addE)}" placeholder="e.g. to burst into tears" autocorrect="off" autocapitalize="off" style="margin-bottom:12px">
    <label class="field-label">Russian translation</label>
    <input type="text" id="addR" value="${esc(state.addR)}" placeholder="e.g. расплакаться" style="margin-bottom:14px">
    <button class="btn btn-green btn-full" data-action="saveWord">Save word</button>
    ${state.addMsg?`<p style="margin-top:8px;font-size:13px;text-align:center;color:${state.addMsg.startsWith("✓")?"#2a6e5a":"#c0392b"}">${esc(state.addMsg)}</p>`:""}
  </div>
  ${list}
</div>`;
};

// ── INFO SCREEN ───────────────────────────────────────────────────────────────
screens.info=function(){
  const steps=[
    ["Create a free GitHub account","github.com → Sign up"],
    ["Create a new public repository","Click + → New repository → name it e.g. \"flashcards\" → Public → Create"],
    ["Upload this HTML file as index.html","In your repo → Add file → Upload files → rename the file to index.html → Commit"],
    ["Enable GitHub Pages","Settings → Pages → Source: Deploy from branch → main → / (root) → Save"],
    ["Open the URL on your iPhone","Your URL: username.github.io/flashcards/"],
    ["Add to home screen","Safari → Share button (□↑) → Add to Home Screen → Add"],
  ];
  return `<div class="page">
  <button class="btn btn-outline btn-small" style="margin-bottom:1.5rem" data-action="goHome">← Back</button>
  <h2 style="margin-bottom:1rem">📱 Add to iPhone home screen</h2>
  <div class="card" style="margin-bottom:1rem">
    <p style="font-size:13px;color:#7a7060;line-height:1.7">To install as an app on iPhone, the file needs to be hosted online. The easiest free option is <strong style="color:#1a1a2e">GitHub Pages</strong>:</p>
  </div>
  ${steps.map(([t,d],i)=>`<div class="info-step">
    <div class="info-num">${i+1}</div>
    <div><p style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:2px">${t}</p><p style="font-size:12px;color:#7a7060">${d}</p></div>
  </div>`).join("")}
  <div class="info-box"><strong>Note:</strong> Progress is saved in your browser's localStorage — it stays on the device. It won't sync between your phone and computer.</div>
</div>`;
};

// ── ESCAPE ────────────────────────────────────────────────────────────────────
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}

// ── BIND EVENTS ───────────────────────────────────────────────────────────────
function bind(){
  // Range slider
  const rng=document.getElementById("npdRange");
  if(rng){
    rng.addEventListener("input",e=>{
      state.meta.newPerDay=Number(e.target.value);
      ss(KM,state.meta);
      const lbl=document.getElementById("npdLabel");
      if(lbl) lbl.textContent=e.target.value;
    });
  }

  // Answer input
  const inp=document.getElementById("answerInput");
  if(inp){
    inp.focus();
    inp.addEventListener("input",e=>{state.typed=e.target.value});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doSubmit()}});
  }
  const addE=document.getElementById("addE");
  const addR=document.getElementById("addR");
  if(addE) addE.addEventListener("input",e=>{state.addE=e.target.value});
  if(addR){
    addR.addEventListener("input",e=>{state.addR=e.target.value});
    addR.addEventListener("keydown",e=>{if(e.key==="Enter") doSaveWord()});
  }

  // Topic pills
  document.querySelectorAll("[data-topic]").forEach(el=>{
    el.addEventListener("click",()=>{
      state.meta.topic=Number(el.dataset.topic);
      ss(KM,state.meta);
      render();
    });
  });

  // Buttons
  document.querySelectorAll("[data-action]").forEach(el=>{
    el.addEventListener("click",()=>actions[el.dataset.action]&&actions[el.dataset.action]());
  });

  // Rate buttons
  document.querySelectorAll("[data-rate]").forEach(el=>{
    el.addEventListener("click",()=>doRate(Number(el.dataset.rate)));
  });
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
const actions={
  start(){
    const q=buildQ();
    if(!q.length){state.screen="done";state.sok=0;state.sfail=0;render();return}
    state.queue=q;state.qi=0;state.typed="";state.submitted=false;state.isOk=false;
    state.sok=0;state.sfail=0;state.screen="study";render();
  },
  goHome(){state.screen="home";render()},
  goAdd(){state.addE="";state.addR="";state.addMsg="";state.screen="add";render()},
  showInfo(){state.screen="info";render()},
  submit(){doSubmit()},
  saveWord(){doSaveWord()},
};

function doSubmit(){
  const inp=document.getElementById("answerInput");
  const typed=inp?inp.value:state.typed;
  if(!typed.trim()||state.submitted) return;
  const w=state.queue[state.qi];
  const ok=checkAnswer(typed,w.e);
  state.typed=typed;state.isOk=ok;state.submitted=true;
  if(ok) state.sok++; else state.sfail++;
  render();
}

function doRate(q){
  const w=state.queue[state.qi];
  const upd=sm2(state.srs[w.id],q);
  state.srs={...state.srs,[w.id]:upd};
  ss(KS,state.srs);
  const nx=state.qi+1;
  if(nx>=state.queue.length){state.screen="done";render();return}
  state.qi=nx;state.typed="";state.submitted=false;state.isOk=false;
  render();
}

function doSaveWord(){
  const e=(document.getElementById("addE")||{value:state.addE}).value.trim();
  const r=(document.getElementById("addR")||{value:state.addR}).value.trim();
  if(!e||!r){state.addMsg="Fill in both fields.";render();return}
  state.custom=[...state.custom,{e,r}];
  ss(KC,state.custom);
  state.addE="";state.addR="";state.addMsg=`✓ "${e}" saved!`;
  render();
  setTimeout(()=>{state.addMsg="";render()},3000);
}

// ── START ─────────────────────────────────────────────────────────────────────
render();
</script>
