<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<title>English Flashcards</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Georgia,serif;background:#f7f4ef;color:#1a1a2e;min-height:100vh}
button,input{font-family:Georgia,serif}
::-webkit-scrollbar{display:none}
.page{max-width:500px;margin:0 auto;padding:1.5rem 1rem 3rem}
.page-center{max-width:500px;margin:0 auto;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center}
h1{font-size:22px;font-weight:600}
h2{font-size:18px;font-weight:600}
.label{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:#7a7060}
.muted{color:#7a7060}
.card{background:#fff;border:1px solid #ddd8d0;border-radius:8px;padding:1.1rem 1.2rem}
.card-study{background:#fff;border:1px solid #ddd8d0;border-radius:12px;padding:1.6rem 1.4rem;text-align:center;margin-bottom:1rem}
.btn{border:none;border-radius:6px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:Georgia,serif;color:#fff}
.btn-dark{background:#1a1a2e}
.btn-green{background:#2a6e5a}
.btn-outline{background:transparent;color:#7a7060;border:1px solid #ddd8d0}
.btn-outline-dark{background:transparent;color:#1a1a2e;border:1.5px solid #ddd8d0}
.btn-full{width:100%;padding:13px;font-size:15px}
.btn-small{font-size:12px;padding:6px 12px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1.2rem}
.stat-box{background:#fff;border:1px solid #ddd8d0;border-radius:8px;padding:10px 6px;text-align:center}
.stat-num{font-size:22px;font-weight:600}
.stat-lbl{font-size:10px;color:#7a7060;letter-spacing:.07em;text-transform:uppercase}
.topic-scroll{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:1.2rem}
.topic-pill{flex-shrink:0;padding:5px 10px;border-radius:20px;font-size:12px;cursor:pointer;white-space:nowrap;font-family:Georgia,serif;border:1.5px solid #ddd8d0;background:#fff;color:#1a1a2e}
.topic-pill.active{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
.progress-bar{background:#ddd8d0;border-radius:3px;height:4px;margin-bottom:1.5rem}
.progress-fill{background:#1a1a2e;height:100%;border-radius:3px;transition:width .3s}
.mini-bar{background:#e8e4dc;border-radius:3px;height:6px;flex:1}
.mini-fill-green{background:#2a6e5a;height:100%;border-radius:3px}
.mini-fill-yellow{background:#e8a020;height:100%;border-radius:3px}
.result-ok{background:#e8f5f0;border:1.5px solid #a8d8c8;border-radius:8px;padding:10px 12px;margin-bottom:.8rem}
.result-fail{background:#fdf0ee;border:1.5px solid #f0c4be;border-radius:8px;padding:10px 12px;margin-bottom:.8rem}
.example-box{background:#f5f0e8;border:1px solid #ddd8d0;border-radius:8px;padding:10px 12px;margin-bottom:.8rem;text-align:left}
.rate-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.rate-btn{border:none;border-radius:6px;font-size:13px;padding:9px 4px;cursor:pointer;color:#fff;font-family:Georgia,serif;font-weight:600;line-height:1.4}
.session-header{display:flex;justify-content:space-between;font-size:12px;color:#7a7060;margin-bottom:5px}
input[type=text]{width:100%;font-size:16px;padding:10px 12px;border:2px solid #ddd8d0;border-radius:6px;outline:none;background:#fafaf8;font-family:Georgia,serif}
input[type=text]:focus{border-color:#1a1a2e}
input[type=range]{width:100%;accent-color:#2a6e5a}
.field-label{font-size:11px;color:#7a7060;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:4px}
.word-list-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #ddd8d0;font-size:13px}
.divider{border-bottom:2px solid #1a1a2e;padding-bottom:1rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:flex-end}
.new-badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:#e8e4dc;color:#7a7060;margin-bottom:8px}
.topic-badge{display:inline-block;font-size:11px;padding:3px 9px;border-radius:10px;background:#f0ebe0;color:#7a7060;margin-top:6px}
.topic-badge.idiom{background:#fef3e2;color:#b07020}
.topic-badge.grammar{background:#e8f0fe;color:#2a5ab0}
.info-step{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.info-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#1a1a2e;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.info-box{background:#e8f5f0;border:1.5px solid #a8d8c8;border-radius:8px;padding:10px 14px;margin-top:.5rem;font-size:12px;color:#2a6e5a;line-height:1.6}
.stats-topic-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #ddd8d0}
.home-btn-row{display:flex;gap:8px;margin-bottom:1.5rem}
</style>
</head>

var EMOJI = ["📚","💬","📝","⚖️","🏥","😊","💼","🌿","🏠","🐾","🍽️","🚗","🎵","📖"];

function sg(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function ss(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function todayStr(){return new Date().toISOString().split("T")[0]}
function addDays(base,n){var d=new Date(base+"T12:00:00");d.setDate(d.getDate()+n);return d.toISOString().split("T")[0]}

function sm2(card,q){
  var iv=0,ez=2.5,reps=0,lapses=0;
  if(card){iv=card.interval||0;ez=card.ease||2.5;reps=card.reps||0;lapses=card.lapses||0}
  var t=todayStr();
  if(q<3){return{interval:1,ease:Math.max(1.3,ez-.2),reps:0,lapses:lapses+1,due:addDays(t,1)}}
  var ni=reps===0?1:reps===1?4:Math.round(iv*ez);
  var ne=Math.max(1.3,ez+.1-(5-q)*(.08+(5-q)*.02));
  return{interval:ni,ease:ne,reps:reps+1,lapses:lapses,due:addDays(t,ni)};
}
function nextInterval(card,q){return sm2(card,q).interval}

function norm(s){return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.,!?]/g,"")}
function checkAnswer(input,correct){
  var inp=norm(input);
  var alts=correct.split(" / ");
  for(var i=0;i<alts.length;i++){if(norm(alts[i].trim())===inp)return true}
  return false;
}
function esc(s){
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

var state={
  screen:"home",
  srs:sg("fc_srs_v1")||{},
  meta:sg("fc_meta_v1")||{newPerDay:20,topic:0},
  custom:sg("fc_custom_v1")||[],
  // Cumulative stats stored separately
  totalStats:sg("fc_total_stats")||{correct:0,incorrect:0,revealed:0},
  queue:[],qi:0,
  typed:"",submitted:false,isOk:false,revealed:false,
  sok:0,sfail:0,srevealed:0,
  addE:"",addR:"",addMsg:""
};

function allWords(){
  var base=[];
  for(var i=0;i<W.length;i++){base.push({id:i,e:W[i][0],r:W[i][1],t:W[i][2],ex:W[i][3]||""})}
  for(var j=0;j<state.custom.length;j++){base.push({id:10000+j,e:state.custom[j].e,r:state.custom[j].r,t:0,ex:""})}
  return base;
}

function buildQ(){
  var words=allWords(),today=todayStr(),tf=state.meta.topic;
  var due=[],newW=[];
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(tf!==0&&w.t!==tf)continue;
    var card=state.srs[w.id];
    if(card&&card.due&&card.due<=today){due.push(w)}
    else if(!card&&newW.length<state.meta.newPerDay){newW.push(w)}
  }
  due.sort(function(){return Math.random()-.5});
  return due.concat(newW);
}

function render(){
  try{document.getElementById("app").innerHTML=screens[state.screen]()}
  catch(e){document.getElementById("app").innerHTML="<div style='padding:2rem;color:red'>Error: "+e.message+"</div>"}
  bind();
}

var screens={};

// ── HOME ──────────────────────────────────────────────────────────────────────
screens.home=function(){
  var words=allWords(),tf=state.meta.topic;
  var tw=[],learned=0;
  for(var i=0;i<words.length;i++){
    var w=words[i];
    if(tf===0||w.t===tf){
      tw.push(w);
      var card=state.srs[w.id];
      if(card&&(card.reps||0)>=2)learned++;
    }
  }
  var dueQ=buildQ(),due=dueQ.length;
  var ts=state.totalStats;
  var totalAnswered=ts.correct+ts.incorrect+ts.revealed;
  var accPct=totalAnswered>0?Math.round(ts.correct/totalAnswered*100):0;

  var pills="";
  for(var i=0;i<TOPICS.length;i++){
    var cnt=i===0?words.length:0;
    if(i>0){for(var j=0;j<words.length;j++){if(words[j].t===i)cnt++}}
    var active=state.meta.topic===i?"active":"";
    pills+='<button class="topic-pill '+active+'" data-topic="'+i+'">'+EMOJI[i]+' '+TOPICS[i]+' <span style="opacity:.55;font-size:11px">('+cnt+')</span></button>';
  }

  return '<div class="page">'+
  '<div class="divider">'+
    '<div><div class="label" style="margin-bottom:3px">Spaced repetition &middot; typing</div><h1>Flashcard Trainer</h1></div>'+
    '<div style="display:flex;gap:6px">'+
      '<button class="btn btn-outline btn-small" data-action="goStats">&#128202; Stats</button>'+
      '<button class="btn btn-outline btn-small" data-action="showInfo">&#128241;</button>'+
    '</div>'+
  '</div>'+

  '<div class="label" style="margin-bottom:7px">Topic</div>'+
  '<div class="topic-scroll">'+pills+'</div>'+

  '<div class="stats-grid">'+
    '<div class="stat-box"><div class="stat-num" style="color:#1a1a2e">'+tw.length+'</div><div class="stat-lbl">Words</div></div>'+
    '<div class="stat-box"><div class="stat-num" style="color:#2a6e5a">'+learned+'</div><div class="stat-lbl">Learned</div></div>'+
    '<div class="stat-box"><div class="stat-num" style="color:'+(due>0?"#c0392b":"#7a7060")+'">'+due+'</div><div class="stat-lbl">Due now</div></div>'+
  '</div>'+

  '<button class="btn btn-full '+(due>0?"btn-dark":"btn-outline")+'" style="margin-bottom:10px;'+(due===0?"opacity:.5":"")+'" data-action="start">'+
    (due>0?'&#9654;&#160; Start session ('+due+' cards)':'&#10003;&#160; Nothing due today')+
  '</button>'+
  '<div class="home-btn-row">'+
    '<button class="btn btn-outline-dark btn-full" data-action="goAdd">+ Add word</button>'+
  '</div>'+

  '<div class="card">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'+
      '<span style="font-size:13px;font-weight:600">New cards per day</span>'+
      '<span style="font-size:17px;font-weight:600;color:#2a6e5a" id="npdLabel">'+state.meta.newPerDay+'</span>'+
    '</div>'+
    '<input type="range" min="5" max="50" step="5" value="'+state.meta.newPerDay+'" id="npdRange">'+
    (totalAnswered>0?'<p style="font-size:11px;color:#7a7060;margin-top:8px">All-time accuracy: <strong style="color:#2a6e5a">'+accPct+'%</strong> ('+ts.correct+' correct / '+(ts.incorrect+ts.revealed)+' missed)</p>':'')+
  '</div>'+
  '</div>';
};

// ── STUDY ─────────────────────────────────────────────────────────────────────
screens.study=function(){
  var w=state.queue[state.qi];
  if(!w){state.screen="done";return screens.done()}
  var pct=Math.round(state.qi/state.queue.length*100);
  var card=state.srs[w.id];
  var isNew=!card;

  // Topic badge
  var topicName=w.t>0?TOPICS[w.t]:"";
  var isIdiom=w.t===1,isGrammar=w.t===2;
  var badgeClass=isIdiom?"idiom":isGrammar?"grammar":"";
  var topicBadge=topicName?'<div><span class="topic-badge '+badgeClass+'">'+EMOJI[w.t]+'&#160;'+topicName+'</span></div>':"";

  var inputArea="";
  if(!state.submitted&&!state.revealed){
    inputArea=
      '<input type="text" id="answerInput" value="'+esc(state.typed)+'" placeholder="type here\u2026" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'+
      '<button class="btn btn-dark btn-full" style="margin-top:10px" data-action="submit">Check &#8629;</button>'+
      '<button class="btn btn-outline btn-full" style="margin-top:8px;font-size:13px;color:#7a7060" data-action="reveal">&#128065; I don\'t know &mdash; show answer</button>';
  } else {
    var showed=state.revealed;
    var resClass=showed?"result-fail":(state.isOk?"result-ok":"result-fail");
    var resColor=showed?"#7a7060":(state.isOk?"#2a6e5a":"#c0392b");
    var resText=showed?"Answer:":(state.isOk?"&#10003; Correct!":"&#10007; Not quite");
    var answerLine='';
    if(showed||!state.isOk){
      answerLine='<p style="margin-top:3px;font-size:15px;color:#1a1a2e"><strong>'+esc(w.e)+'</strong></p>';
    }
    var exampleBox="";
    if(w.ex){
      exampleBox='<div class="example-box">'+
        '<p style="font-size:10px;color:#7a7060;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px">Example</p>'+
        '<p style="font-size:13px;color:#1a1a2e;font-style:italic;line-height:1.5">'+esc(w.ex)+'</p>'+
      '</div>';
    }
    inputArea=
      '<div class="'+resClass+'">'+
        '<p style="font-size:13px;font-weight:600;color:'+resColor+'">'+resText+'</p>'+
        answerLine+
      '</div>'+
      exampleBox+
      '<p class="label" style="margin-bottom:7px">How well did you know it?</p>'+
      '<div class="rate-grid">'+
        '<button class="rate-btn" style="background:#c0392b" data-rate="1">Again<br><span style="font-size:10px;font-weight:400">1d</span></button>'+
        '<button class="rate-btn" style="background:#2a6e5a" data-rate="4">Good<br><span style="font-size:10px;font-weight:400">'+nextInterval(card,4)+'d</span></button>'+
        '<button class="rate-btn" style="background:#1a6a8a" data-rate="5">Easy<br><span style="font-size:10px;font-weight:400">'+nextInterval(card,5)+'d</span></button>'+
      '</div>';
  }

  return '<div class="page">'+
  '<div class="session-header">'+
    '<span>'+state.qi+'/'+state.queue.length+'</span>'+
    '<span><span style="color:#2a6e5a">&#10003;'+state.sok+'</span>&#160;'+
    '<span style="color:#c0392b">&#10007;'+state.sfail+'</span>&#160;'+
    '<span style="color:#7a7060;font-size:11px">&#128065;'+state.srevealed+'</span></span>'+
  '</div>'+
  '<div class="progress-bar"><div class="progress-fill" style="width:'+pct+'%"></div></div>'+
  '<div class="card-study">'+
    (isNew?'<div class="new-badge">new word</div>':'')+
    '<p class="label" style="margin-bottom:8px">Type the English:</p>'+
    '<p style="font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:4px;line-height:1.3">'+esc(w.r)+'</p>'+
    topicBadge+
    '<div style="margin-top:1.2rem">'+inputArea+'</div>'+
  '</div>'+
  '<button class="btn btn-outline btn-small" data-action="goHome">&#8592; Home</button>'+
  '</div>';
};

// ── DONE ──────────────────────────────────────────────────────────────────────
screens.done=function(){
  var total=state.sok+state.sfail+state.srevealed;
  var accPct=total>0?Math.round(state.sok/total*100):0;
  return '<div class="page-center">'+
  '<p style="font-size:44px;margin-bottom:8px">&#127881;</p>'+
  '<h2 style="margin-bottom:8px">Session complete!</h2>'+
  (total>0
    ?'<p class="muted" style="font-size:14px;margin-bottom:4px">'+
      '<span style="color:#2a6e5a">&#10003; '+state.sok+'</span> correct &nbsp;'+
      '<span style="color:#c0392b">&#10007; '+state.sfail+'</span> wrong &nbsp;'+
      '<span style="color:#7a7060">&#128065; '+state.srevealed+'</span> revealed</p>'+
      '<p class="muted" style="font-size:13px;margin-bottom:1.5rem">Accuracy: <strong style="color:#2a6e5a">'+accPct+'%</strong></p>'
    :'<p class="muted" style="font-size:14px;margin-bottom:1.5rem">Nothing due &mdash; come back tomorrow!</p>')+
  '<button class="btn btn-dark" style="padding:11px 32px" data-action="goHome">Back to home</button>'+
  '</div>';
};

// ── STATS ─────────────────────────────────────────────────────────────────────
screens.stats=function(){
  var words=allWords();
  var ts=state.totalStats;
  var totalAnswered=ts.correct+ts.incorrect+ts.revealed;
  var accPct=totalAnswered>0?Math.round(ts.correct/totalAnswered*100):0;

  // Overall counts
  var totalNew=0,totalLearning=0,totalLearned=0,totalDue=0;
  var today=todayStr();
  for(var i=0;i<words.length;i++){
    var w=words[i]; var card=state.srs[w.id];
    if(!card){totalNew++}
    else if((card.reps||0)>=2){totalLearned++}
    else{totalLearning++}
    if(card&&card.due&&card.due<=today)totalDue++;
  }

  // Overall bar
  var tot=words.length;
  var learnedPct=Math.round(totalLearned/tot*100);
  var learningPct=Math.round(totalLearning/tot*100);

  // Per topic rows
  var topicRows="";
  for(var t=1;t<TOPICS.length;t++){
    var tw=[],tlearned=0,tdue=0;
    for(var i=0;i<words.length;i++){
      if(words[i].t!==t)continue;
      tw.push(words[i]);
      var card=state.srs[words[i].id];
      if(card&&(card.reps||0)>=2)tlearned++;
      if(card&&card.due&&card.due<=today)tdue++;
    }
    if(tw.length===0)continue;
    var tpct=Math.round(tlearned/tw.length*100);
    topicRows+='<div class="stats-topic-row">'+
      '<span style="font-size:14px;width:20px;flex-shrink:0">'+EMOJI[t]+'</span>'+
      '<span style="font-size:12px;color:#1a1a2e;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">'+TOPICS[t]+'</span>'+
      '<span style="font-size:11px;color:#7a7060;flex-shrink:0;margin:0 8px">'+tlearned+'/'+tw.length+'</span>'+
      '<div class="mini-bar" style="flex-shrink:0;width:60px"><div class="mini-fill-green" style="width:'+tpct+'%"></div></div>'+
      (tdue>0?'<span style="font-size:11px;color:#c0392b;flex-shrink:0;margin-left:6px">'+tdue+' due</span>':'')+
    '</div>';
  }

  return '<div class="page">'+
  '<div style="display:flex;align-items:center;gap:12px;margin-bottom:1.5rem">'+
    '<button class="btn btn-outline btn-small" data-action="goHome">&#8592;</button>'+
    '<h2>Your Progress</h2>'+
  '</div>'+

  '<div class="card" style="margin-bottom:1rem">'+
    '<p style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:10px">All '+tot+' words</p>'+
    '<div style="display:flex;gap:4px;height:10px;border-radius:5px;overflow:hidden;margin-bottom:8px">'+
      '<div style="background:#2a6e5a;width:'+learnedPct+'%"></div>'+
      '<div style="background:#e8a020;width:'+learningPct+'%"></div>'+
      '<div style="background:#e8e4dc;flex:1"></div>'+
    '</div>'+
    '<div style="display:flex;gap:16px;font-size:12px;color:#7a7060">'+
      '<span><span style="color:#2a6e5a">&#9632;</span> Learned: '+totalLearned+'</span>'+
      '<span><span style="color:#e8a020">&#9632;</span> In progress: '+totalLearning+'</span>'+
      '<span><span style="color:#ccc">&#9632;</span> New: '+totalNew+'</span>'+
    '</div>'+
  '</div>'+

  '<div class="card" style="margin-bottom:1rem">'+
    '<p style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:8px">All-time accuracy</p>'+
    (totalAnswered>0
      ?'<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">'+
          '<span style="font-size:32px;font-weight:600;color:'+(accPct>=70?"#2a6e5a":accPct>=50?"#e8a020":"#c0392b")+'">'+accPct+'%</span>'+
          '<span style="font-size:12px;color:#7a7060">'+totalAnswered+' answers total</span>'+
        '</div>'+
        '<div style="display:flex;gap:12px;font-size:12px;color:#7a7060">'+
          '<span style="color:#2a6e5a">&#10003; '+ts.correct+' correct</span>'+
          '<span style="color:#c0392b">&#10007; '+ts.incorrect+' wrong</span>'+
          '<span>&#128065; '+ts.revealed+' revealed</span>'+
        '</div>'
      :'<p style="font-size:13px;color:#7a7060">No sessions yet &mdash; start studying to see stats.</p>')+
  '</div>'+

  '<p class="label" style="margin-bottom:8px">By topic</p>'+
  '<div class="card">'+topicRows+'</div>'+
  '</div>';
};

// ── ADD ───────────────────────────────────────────────────────────────────────
screens.add=function(){
  var recent=state.custom.slice().reverse().slice(0,10);
  var list="";
  if(recent.length){
    list='<div style="margin-top:1.2rem"><p class="label" style="margin-bottom:6px">Your added words ('+state.custom.length+')</p>';
    for(var i=0;i<recent.length;i++){
      list+='<div class="word-list-item"><span style="font-weight:600">'+esc(recent[i].e)+'</span><span class="muted">'+esc(recent[i].r)+'</span></div>';
    }
    list+='</div>';
  }
  var msg=state.addMsg?'<p style="margin-top:8px;font-size:13px;text-align:center;color:'+(state.addMsg.indexOf("\u2713")===0?"#2a6e5a":"#c0392b")+'">'+esc(state.addMsg)+'</p>':"";
  return '<div class="page">'+
  '<button class="btn btn-outline btn-small" style="margin-bottom:1.5rem" data-action="goHome">&#8592; Back</button>'+
  '<h2 style="margin-bottom:1.2rem">Add a word or phrase</h2>'+
  '<div class="card">'+
    '<label class="field-label">English word / phrase</label>'+
    '<input type="text" id="addE" value="'+esc(state.addE)+'" placeholder="e.g. to burst into tears" autocorrect="off" autocapitalize="off" style="margin-bottom:12px">'+
    '<label class="field-label">Russian translation</label>'+
    '<input type="text" id="addR" value="'+esc(state.addR)+'" placeholder="e.g. \u0440\u0430\u0441\u043f\u043b\u0430\u043a\u0430\u0442\u044c\u0441\u044f" style="margin-bottom:14px">'+
    '<button class="btn btn-green btn-full" data-action="saveWord">Save word</button>'+
    msg+
  '</div>'+list+'</div>';
};

// ── INFO ──────────────────────────────────────────────────────────────────────
screens.info=function(){
  var steps=[
    ["Create a free GitHub account","github.com \u2192 Sign up"],
    ["Create a new public repository","Click + \u2192 New repository \u2192 name e.g. \"flashcards\" \u2192 Public \u2192 Create"],
    ["Upload this file as index.html","Add file \u2192 Upload \u2192 make sure filename is index.html \u2192 Commit"],
    ["Enable GitHub Pages","Settings \u2192 Pages \u2192 main branch \u2192 / (root) \u2192 Save"],
    ["Open on iPhone","username.github.io/flashcards"],
    ["Add to home screen","Safari \u2192 Share (\u25a1\u2191) \u2192 Add to Home Screen"]
  ];
  var html='<div class="page">'+
    '<button class="btn btn-outline btn-small" style="margin-bottom:1.5rem" data-action="goHome">&#8592; Back</button>'+
    '<h2 style="margin-bottom:1rem">&#128241; iPhone install guide</h2>'+
    '<div class="card" style="margin-bottom:1rem"><p style="font-size:13px;color:#7a7060;line-height:1.7">Host on <strong style="color:#1a1a2e">GitHub Pages</strong> (free), then add to home screen in Safari:</p></div>';
  for(var i=0;i<steps.length;i++){
    html+='<div class="info-step"><div class="info-num">'+(i+1)+'</div>'+
    '<div><p style="font-size:13px;font-weight:600;color:#1a1a2e;margin-bottom:2px">'+steps[i][0]+'</p>'+
    '<p style="font-size:12px;color:#7a7060">'+steps[i][1]+'</p></div></div>';
  }
  html+='<div class="info-box">Progress is saved in localStorage on your device only.</div></div>';
  return html;
};

// ── BIND ──────────────────────────────────────────────────────────────────────
function bind(){
  var rng=document.getElementById("npdRange");
  if(rng){
    rng.onchange=rng.oninput=function(e){
      state.meta.newPerDay=Number(e.target.value);
      ss("fc_meta_v1",state.meta);
      var lbl=document.getElementById("npdLabel");
      if(lbl)lbl.textContent=e.target.value;
    };
  }
  var inp=document.getElementById("answerInput");
  if(inp){
    inp.oninput=function(e){state.typed=e.target.value};
    inp.onkeydown=function(e){if(e.keyCode===13){e.preventDefault();doSubmit()}};
    setTimeout(function(){try{inp.focus()}catch(e){}},100);
  }
  var addE=document.getElementById("addE");
  var addR=document.getElementById("addR");
  if(addE)addE.oninput=function(e){state.addE=e.target.value};
  if(addR){
    addR.oninput=function(e){state.addR=e.target.value};
    addR.onkeydown=function(e){if(e.keyCode===13)doSaveWord()};
  }
  var pills=document.querySelectorAll("[data-topic]");
  for(var i=0;i<pills.length;i++){
    (function(el){el.onclick=function(){state.meta.topic=Number(el.getAttribute("data-topic"));ss("fc_meta_v1",state.meta);render()}})(pills[i]);
  }
  var btns=document.querySelectorAll("[data-action]");
  for(var j=0;j<btns.length;j++){
    (function(el){el.onclick=function(){var a=el.getAttribute("data-action");if(actions[a])actions[a]()}})(btns[j]);
  }
  var rateBtns=document.querySelectorAll("[data-rate]");
  for(var k=0;k<rateBtns.length;k++){
    (function(el){el.onclick=function(){doRate(Number(el.getAttribute("data-rate")))}})(rateBtns[k]);
  }
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
var actions={
  start:function(){
    var q=buildQ();
    if(!q.length){state.screen="done";state.sok=0;state.sfail=0;state.srevealed=0;render();return}
    state.queue=q;state.qi=0;state.typed="";state.submitted=false;state.isOk=false;state.revealed=false;
    state.sok=0;state.sfail=0;state.srevealed=0;state.screen="study";render();
  },
  goHome:function(){state.screen="home";render()},
  goAdd:function(){state.addE="";state.addR="";state.addMsg="";state.screen="add";render()},
  goStats:function(){state.screen="stats";render()},
  showInfo:function(){state.screen="info";render()},
  submit:function(){doSubmit()},
  reveal:function(){doReveal()},
  saveWord:function(){doSaveWord()}
};

function doSubmit(){
  var inp=document.getElementById("answerInput");
  var typed=inp?inp.value:state.typed;
  if(!typed.trim()||state.submitted||state.revealed)return;
  var w=state.queue[state.qi];
  var ok=checkAnswer(typed,w.e);
  state.typed=typed;state.isOk=ok;state.submitted=true;
  if(ok){
    state.sok++;
    state.totalStats.correct++;
  }else{
    state.sfail++;
    state.totalStats.incorrect++;
  }
  ss("fc_total_stats",state.totalStats);
  render();
}

function doReveal(){
  state.revealed=true;
  state.srevealed++;
  state.totalStats.revealed++;
  ss("fc_total_stats",state.totalStats);
  render();
}

function doRate(q){
  var w=state.queue[state.qi];
  var card=state.srs[w.id]||null;
  // If revealed, force "Again"
  var effectiveQ=state.revealed?1:q;
  var upd=sm2(card,effectiveQ);
  state.srs[w.id]=upd;
  ss("fc_srs_v1",state.srs);
  var nx=state.qi+1;
  if(nx>=state.queue.length){state.screen="done";render();return}
  state.qi=nx;state.typed="";state.submitted=false;state.isOk=false;state.revealed=false;
  render();
}

function doSaveWord(){
  var eEl=document.getElementById("addE");
  var rEl=document.getElementById("addR");
  var e=(eEl?eEl.value:state.addE).trim();
  var r=(rEl?rEl.value:state.addR).trim();
  if(!e||!r){state.addMsg="Fill in both fields.";render();return}
  state.custom.push({e:e,r:r});
  ss("fc_custom_v1",state.custom);
  state.addE="";state.addR="";state.addMsg="\u2713 \""+e+"\" saved!";
  render();
  setTimeout(function(){state.addMsg="";render()},3000);
}

render();
</script>
