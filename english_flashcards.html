const K_SRS  = "fc_srs_v1";
const K_META = "fc_meta_v1";
const K_CUST = "fc_custom_v1";

function todayStr() { return new Date().toISOString().split("T")[0]; }
function addDays(base, n) {
  const d = new Date(base + "T12:00:00"); d.setDate(d.getDate() + n);
  return d.toISOString().split("T")[0];
}
function normalize(s) { return s.toLowerCase().trim().replace(/\s+/g," ").replace(/[.,!?]/g,""); }
function checkAnswer(input, correct) {
  const inp = normalize(input);
  return correct.split(" / ").map(a => normalize(a.trim())).some(a => a === inp);
}
function sm2(card, q) {
  let {interval=0, ease=2.5, reps=0, lapses=0} = card||{};
  const today = todayStr();
  if (q < 3) return {interval:1, ease:Math.max(1.3,ease-0.2), reps:0, lapses:lapses+1, due:addDays(today,1)};
  let ni = reps===0?1: reps===1?4: Math.round(interval*ease);
  let ne = Math.max(1.3, ease+0.1-(5-q)*(0.08+(5-q)*0.02));
  return {interval:ni, ease:ne, reps:reps+1, lapses, due:addDays(today,ni)};
}
function sGet(k) { try{const v=localStorage.getItem(k);return v?JSON.parse(v):null;}catch{return null;} }
function sSet(k,v) { try{localStorage.setItem(k,JSON.stringify(v));}catch{} }

const C = {bg:"#f7f4ef",ink:"#1a1a2e",muted:"#7a7060",accent:"#2a6e5a",red:"#c0392b",line:"#ddd8d0",card:"#ffffff"};
const btn = (bg, col="#fff", extra={}) => ({padding:"10px 20px",background:bg,color:col,border:"none",borderRadius:6,fontSize:14,fontWeight:600,cursor:"pointer",fontFamily:"Georgia,serif",...extra});

  const [screen, setScreen]   = useState("loading");

  const [custom, setCustom]   = useState([]);
  const [queue, setQueue]     = useState([]);
  const [qi, setQi]           = useState(0);
  const [typed, setTyped]     = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [isOk, setIsOk]       = useState(null);
  const [sok, setSok]         = useState(0);
  const [sfail, setSfail]     = useState(0);

  const [addR, setAddR]       = useState("");
  const [addMsg, setAddMsg]   = useState("");
  const [showInfo, setShowInfo] = useState(false);
  const srsRef  = useRef({});
  const inputRef = useRef(null);

  const allWords = useCallback(() => {
    const base = W.map(([e,r,t],i) => ({id:i,e,r,t}));
    const cust = custom.map((w,i) => ({id:10000+i,e:w.e,r:w.r,t:0}));
    return [...base,...cust];
  }, [custom]);

  useEffect(() => {
    const s = sGet(K_SRS)||{};
    const m = sGet(K_META)||{newPerDay:20,topic:0};
    const c = sGet(K_CUST)||[];
    srsRef.current=s; setSrs(s); setMeta(m); setCustom(c); setScreen("home");
  }, []);

  const buildQ = useCallback((s,m,c) => {
    const words = allWords();
    const today = todayStr();
    const tf = m.topic;
    const inT = w => tf===0 || w.t===tf;
    const due = words.filter(w => inT(w) && s[w.id]?.due && s[w.id].due <= today);
    const newW = words.filter(w => inT(w) && !s[w.id]).slice(0, m.newPerDay);
    return [...due.sort(()=>Math.random()-0.5), ...newW];
  }, [allWords]);

  function startSession() {
    const q = buildQ(srsRef.current, meta, custom);
    if (!q.length) { setScreen("done"); return; }
    setQueue(q); setQi(0); setTyped(""); setSubmitted(false); setSok(0); setSfail(0); setScreen("study");
    setTimeout(() => inputRef.current?.focus(), 150);
  }

  function submit() {
    if (!typed.trim() || submitted) return;
    const w=queue[qi]; const ok=checkAnswer(typed, w.e);
    setIsOk(ok); setSubmitted(true);
    if (ok) setSok(p=>p+1); else setSfail(p=>p+1);
  }

  function rate(q) {
    const w=queue[qi];
    const upd=sm2(srsRef.current[w.id],q);
    const ns={...srsRef.current,[w.id]:upd};
    srsRef.current=ns; setSrs(ns); sSet(K_SRS,ns);
    const nx=qi+1;
    if (nx>=queue.length) { setScreen("done"); return; }
    setQi(nx); setTyped(""); setSubmitted(false); setIsOk(null);
    setTimeout(() => inputRef.current?.focus(), 80);
  }

  function saveWord() {
    if (!addE.trim() || !addR.trim()) { setAddMsg("Fill in both fields."); return; }
    const nc=[...custom, {e:addE.trim(), r:addR.trim()}];
    setCustom(nc); sSet(K_CUST,nc);
    setAddE(""); setAddR(""); setAddMsg(`✓ "${addE.trim()}" saved!`);
    setTimeout(() => setAddMsg(""), 3000);
  }

  const dueCount=dueQ.length;

  if (screen==="loading") return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:C.bg,color:C.muted}}>
      Loading…
    </div>
  );

  // ── INFO MODAL ───────────────────────────────────────────────────────────────
  if (showInfo) return (
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",padding:"1.5rem 1rem",maxWidth:500,margin:"0 auto"}}>
      <button onClick={()=>setShowInfo(false)} style={{...btn("transparent",C.muted),fontSize:12,padding:"6px 12px",border:`1px solid ${C.line}`,marginBottom:"1.5rem"}}>← Back</button>
      <h2 style={{fontSize:18,color:C.ink,margin:"0 0 1rem"}}>📱 Add to iPhone home screen</h2>

      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:8,padding:"1.1rem 1.2rem",marginBottom:"1rem"}}>
        <p style={{fontSize:13,color:C.muted,lineHeight:1.7,margin:0}}>
          To install this app on your iPhone home screen, the file needs to be hosted online.
          The easiest free option is <strong style={{color:C.ink}}>GitHub Pages</strong>:
        </p>
      </div>

      {[
        ["1","Create a free GitHub account","github.com → Sign up"],
        ["2","Create a new repository","Click + → New repository → name it e.g. "flashcards" → Public → Create"],
        ["3","Upload this HTML file","In your repo → Add file → Upload files → drag this file in → Commit"],
        ["4","Enable GitHub Pages","Settings → Pages → Source: main branch → Save"],
        ["5","Open on iPhone","Your URL will be: username.github.io/flashcards/index.html"],
        ["6","Add to home screen","Safari → Share button → Add to Home Screen → Add"],
      ].map(([n,title,desc])=>(
        <div key={n} style={{display:"flex",gap:12,marginBottom:14,alignItems:"flex-start"}}>
          <div style={{flexShrink:0,width:26,height:26,borderRadius:"50%",background:C.ink,color:"white",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700}}>{n}</div>
          <div>
            <p style={{fontSize:13,fontWeight:600,color:C.ink,margin:"0 0 2px"}}>{title}</p>
            <p style={{fontSize:12,color:C.muted,margin:0}}>{desc}</p>
          </div>
        </div>
      ))}

      <div style={{background:"#e8f5f0",border:"1.5px solid #a8d8c8",borderRadius:8,padding:"10px 14px",marginTop:"0.5rem"}}>
        <p style={{fontSize:12,color:C.accent,margin:0,lineHeight:1.6}}>
          <strong>Important:</strong> Your progress (SRS data, custom words) is saved in the browser's localStorage — it stays on your device. If you use the app on two different devices, progress won't sync between them.
        </p>
      </div>
    </div>
  );

  // ── HOME ─────────────────────────────────────────────────────────────────────
  if (screen==="home") return (
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",padding:"1.5rem 1rem 3rem",maxWidth:500,margin:"0 auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",borderBottom:`2px solid ${C.ink}`,paddingBottom:"1rem",marginBottom:"1.5rem"}}>
        <div>
          <p style={{fontSize:11,letterSpacing:"0.14em",textTransform:"uppercase",color:C.muted,margin:"0 0 3px"}}>Spaced repetition · typing</p>
          <h1 style={{fontSize:22,fontWeight:600,margin:0,color:C.ink}}>Flashcard Trainer</h1>
        </div>
        <button onClick={()=>setShowInfo(true)} style={{...btn("transparent",C.muted),fontSize:12,padding:"5px 10px",border:`1px solid ${C.line}`}}>📱 iPhone</button>
      </div>

      <p style={{fontSize:11,letterSpacing:"0.12em",textTransform:"uppercase",color:C.muted,margin:"0 0 7px"}}>Topic</p>
      <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8,marginBottom:"1.2rem"}}>
        {TOPICS.map((t,i) => {
          const cnt=i===0?words.length:words.filter(w=>w.t===i).length;
          const active=meta.topic===i;
          return <button key={i} onClick={()=>changeTopic(i)} style={{flexShrink:0,padding:"5px 10px",background:active?C.ink:"white",color:active?"white":C.ink,border:`1.5px solid ${active?C.ink:C.line}`,borderRadius:20,fontSize:12,cursor:"pointer",fontFamily:"Georgia,serif",whiteSpace:"nowrap"}}>
            {TOPIC_EMOJI[i]} {t} <span style={{opacity:0.55,fontSize:11}}>({cnt})</span>
          </button>;
        })}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:"1.2rem"}}>
        {[["Words",topicWords.length,C.ink],["Learned",learned,C.accent],["Due now",dueCount,dueCount>0?C.red:C.muted]].map(([l,v,col])=>(
          <div key={l} style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:8,padding:"10px 6px",textAlign:"center"}}>
            <div style={{fontSize:22,fontWeight:600,color:col}}>{v}</div>
            <div style={{fontSize:10,color:C.muted,letterSpacing:"0.07em",textTransform:"uppercase"}}>{l}</div>
          </div>
        ))}
      </div>

      <button onClick={startSession} style={{...btn(dueCount>0?C.ink:C.muted),width:"100%",padding:"13px",fontSize:15,marginBottom:10,opacity:dueCount===0?0.5:1}}>
        {dueCount>0?`▶  Start session (${dueCount} cards)`:"✓  Nothing due today"}
      </button>
      <button onClick={()=>setScreen("add")} style={{...btn("transparent",C.ink),width:"100%",border:`1.5px solid ${C.line}`,marginBottom:"1.5rem"}}>
        + Add word / phrase
      </button>

      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:8,padding:"12px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <span style={{fontSize:13,fontWeight:600,color:C.ink}}>New cards per day</span>
          <span style={{fontSize:17,fontWeight:600,color:C.accent}}>{meta.newPerDay}</span>
        </div>
        <input type="range" min={5} max={50} step={5} value={meta.newPerDay} onChange={e=>changeNpd(Number(e.target.value))} style={{width:"100%"}}/>
        <p style={{fontSize:11,color:C.muted,margin:"5px 0 0"}}>These are review words — you've seen them all in lessons.</p>
      </div>
    </div>
  );

  // ── STUDY ─────────────────────────────────────────────────────────────────────
  if (screen==="study") {
    const w=queue[qi]; const pct=Math.round(qi/queue.length*100); const isNew=!srs[w?.id];
    return (
      <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",padding:"1.5rem 1rem",maxWidth:500,margin:"0 auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",fontSize:12,color:C.muted,marginBottom:5}}>
          <span>{qi}/{queue.length}</span>
          <span><span style={{color:C.accent}}>✓ {sok}</span>  <span style={{color:C.red}}>✗ {sfail}</span></span>
        </div>
        <div style={{background:C.line,borderRadius:3,height:4,marginBottom:"1.5rem"}}>
          <div style={{background:C.ink,height:"100%",width:pct+"%",borderRadius:3,transition:"width 0.3s"}}/>
        </div>

        <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:12,padding:"1.8rem 1.4rem",marginBottom:"1rem",textAlign:"center"}}>
          {isNew && <span style={{display:"inline-block",fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",padding:"2px 8px",borderRadius:10,background:"#e8e4dc",color:C.muted,marginBottom:10}}>new word</span>}
          <p style={{fontSize:10,color:C.muted,letterSpacing:"0.12em",textTransform:"uppercase",margin:"0 0 8px"}}>Type the English:</p>
          <p style={{fontSize:21,fontWeight:600,color:C.ink,margin:"0 0 1.5rem",lineHeight:1.3}}>{w.r}</p>

          {!submitted ? (
            <div>
              <input ref={inputRef} value={typed} onChange={e=>setTyped(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&submit()}
                placeholder="type here…" autoComplete="off" spellCheck={false} autoCorrect="off" autoCapitalize="off"
                style={{width:"100%",fontSize:16,padding:"10px 12px",border:`2px solid ${C.line}`,borderRadius:6,outline:"none",background:"#fafaf8",boxSizing:"border-box",fontFamily:"Georgia,serif"}}/>
              <button onClick={submit} style={{...btn(C.ink),width:"100%",marginTop:10}}>Check ↵</button>
            </div>
          ) : (
            <div>
              <div style={{padding:"10px",borderRadius:8,background:isOk?"#e8f5f0":"#fdf0ee",border:`1.5px solid ${isOk?"#a8d8c8":"#f0c4be"}`,marginBottom:"1rem"}}>
                <p style={{margin:"0 0 3px",fontSize:14,fontWeight:600,color:isOk?C.accent:C.red}}>{isOk?"✓ Correct!":"✗ Not quite"}</p>
                {!isOk && <p style={{margin:0,fontSize:14,color:C.ink}}>Answer: <strong>{w.e}</strong></p>}
              </div>
              <p style={{fontSize:10,color:C.muted,margin:"0 0 7px",letterSpacing:"0.08em",textTransform:"uppercase"}}>How well did you know it?</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                <button onClick={()=>rate(1)} style={{...btn("#c0392b"),fontSize:13,padding:"9px 4px"}}>Again<br/><span style={{fontSize:10,fontWeight:400}}>1d</span></button>
                <button onClick={()=>rate(4)} style={{...btn(C.accent),fontSize:13,padding:"9px 4px"}}>Good<br/><span style={{fontSize:10,fontWeight:400}}>{sm2(srs[w.id],4).interval}d</span></button>
                <button onClick={()=>rate(5)} style={{...btn("#1a6a8a"),fontSize:13,padding:"9px 4px"}}>Easy<br/><span style={{fontSize:10,fontWeight:400}}>{sm2(srs[w.id],5).interval}d</span></button>
              </div>
            </div>
          )}
        </div>
        <button onClick={()=>setScreen("home")} style={{...btn("transparent",C.muted),fontSize:12,padding:"6px 12px",border:`1px solid ${C.line}`}}>← Home</button>
      </div>
    );
  }

  // ── DONE ─────────────────────────────────────────────────────────────────────
  if (screen==="done") return (
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"2rem",textAlign:"center"}}>
      <p style={{fontSize:44,margin:"0 0 8px"}}>🎉</p>
      <h2 style={{fontSize:20,color:C.ink,margin:"0 0 8px"}}>Session complete!</h2>
      {(sok+sfail)>0 && <p style={{color:C.muted,fontSize:14,margin:"0 0 1.5rem"}}><span style={{color:C.accent}}>✓ {sok}</span> correct · <span style={{color:C.red}}>✗ {sfail}</span> incorrect</p>}
      {(sok+sfail)===0 && <p style={{color:C.muted,fontSize:14,margin:"0 0 1.5rem"}}>Nothing due — come back tomorrow!</p>}
      <button onClick={()=>setScreen("home")} style={{...btn(C.ink),padding:"11px 32px"}}>Back to home</button>
    </div>
  );

  // ── ADD WORD ──────────────────────────────────────────────────────────────────
  if (screen==="add") return (
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",padding:"1.5rem 1rem",maxWidth:500,margin:"0 auto"}}>
      <button onClick={()=>setScreen("home")} style={{...btn("transparent",C.muted),fontSize:12,padding:"6px 12px",border:`1px solid ${C.line}`,marginBottom:"1.5rem"}}>← Back</button>
      <h2 style={{fontSize:18,color:C.ink,margin:"0 0 1.2rem"}}>Add a word or phrase</h2>
      <div style={{background:C.card,border:`1px solid ${C.line}`,borderRadius:8,padding:"1.1rem"}}>
        {[["English word / phrase",addE,setAddE,"e.g. to burst into tears"],["Russian translation",addR,setAddR,"e.g. расплакаться"]].map(([lbl,val,setter,ph],i)=>(
          <div key={i} style={{marginBottom:12}}>
            <label style={{fontSize:11,color:C.muted,letterSpacing:"0.08em",textTransform:"uppercase",display:"block",marginBottom:4}}>{lbl}</label>
            <input value={val} onChange={e=>setter(e.target.value)} onKeyDown={e=>e.key==="Enter"&&i===1&&saveWord()}
              placeholder={ph} autoCorrect="off" autoCapitalize="off"
              style={{width:"100%",fontSize:15,padding:"9px 12px",border:`1.5px solid ${C.line}`,borderRadius:6,outline:"none",background:"#fafaf8",boxSizing:"border-box",fontFamily:"Georgia,serif"}}/>
          </div>
        ))}
        <button onClick={saveWord} style={{...btn(C.accent),width:"100%"}}>Save word</button>
        {addMsg && <p style={{margin:"8px 0 0",fontSize:13,color:addMsg.startsWith("✓")?C.accent:C.red,textAlign:"center"}}>{addMsg}</p>}
      </div>

      {custom.length>0 && (
        <div style={{marginTop:"1.2rem"}}>
          <p style={{fontSize:11,color:C.muted,margin:"0 0 6px",textTransform:"uppercase",letterSpacing:"0.08em"}}>Your added words ({custom.length})</p>
          {[...custom].reverse().slice(0,10).map((w,i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:`1px solid ${C.line}`,fontSize:13}}>
              <span style={{color:C.ink,fontWeight:600}}>{w.e}</span>
              <span style={{color:C.muted}}>{w.r}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );

  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
